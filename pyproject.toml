[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "nodiguard"
version = "0.1.0"
authors = [
  { name = "NodiGuard Open Source Team", email = "oss@nodiguard.dev" },
]
description = "Zero-Trust Local AI Security Gateway, DLP Sentinel & System Memory Optimizer for Cursor, VS Code, and Autonomous Agents."
readme = "README.md"
requires-python = ">=3.9"
license = { text = "Apache-2.0" }
keywords = [
  "ai-security",
  "dlp",
  "cursor",
  "vibe-coding",
  "prompt-injection",
  "memory-optimizer",
  "reverse-proxy",
  "cybersecurity"
]
classifiers = [
  "Development Status :: 4 - Beta",
  "Intended Audience :: Developers",
  "Topic :: Security",
  "Topic :: Software Development :: Build Tools",
  "License :: OSI Approved :: Apache Software License",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.9",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Operating System :: OS Independent",
]
dependencies = [
  "requests>=2.28.0",
  "psutil>=5.9.0"
]

[project.optional-dependencies]
dev = [
  "pytest>=7.0.0",
  "flake8>=6.0.0",
  "build>=0.10.0"
]

[project.urls]
"Homepage" = "https://github.com/nodiguard/nodiguard"
"Bug Tracker" = "https://github.com/nodiguard/nodiguard/issues"
"Documentation" = "https://github.com/nodiguard/nodiguard#readme"

[project.scripts]
nodiguard = "nodiguard.cli:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["nodiguard*"]
